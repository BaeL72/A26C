###########
# SCRIPTS #
###########

##########
# WINDOW #
##########

bind = Super, F, fullscreen, 1
bind = Super+SHIFT, F, fullscreen, 0

bind = SUPER, S, layoutmsg, togglesplit
bind = SUPER, I, layoutmsg, swapsplit
bind = Super, H, movefocus, l
bind = Super, L, movefocus, r
bind = Super, J, movefocus, d
bind = Super, K, movefocus, u

bind = Super+Shift, H, movewindow, l
bind = Super+Shift, L, movewindow, r
bind = Super+Shift, J, movewindow, d
bind = Super+Shift, K, movewindow, u

binde = Ctrl+Super, H, resizeactive, -10 0 
binde = Ctrl+Super, L, resizeactive, 10 0 
binde = Ctrl+Super, K, resizeactive, 0 -10 
binde = Ctrl+Super, J, resizeactive, 0 10

bind = SUPER ALT, F, togglefloating
binde = SUPER ALT, H, moveactive, -10 0
binde = SUPER ALT, L, moveactive, 10 0
binde = SUPER ALT, J, moveactive, 0 10
binde = SUPER ALT, K, moveactive, 0 -10
bind = SUPER ALT, C, centerwindow

##############
# WORKSPACES #
##############

binde = Super, N, workspace, r+1
binde = Super, P, workspace, r-1

bind = Super, 1, workspace, 1
bind = Super, 2, workspace, 2
bind = Super, 3, workspace, 3
bind = Super, 4, workspace, 4
bind = Super, 5, workspace, 5
bind = Super, 6, workspace, 6
bind = Super, 7, workspace, 7
bind = Super, 8, workspace, 8
bind = Super, 9, workspace, 9
bind = Super, 0, workspace, 10

bind = Super+Shift, 1, movetoworkspacesilent, 1
bind = Super+Shift, 2, movetoworkspacesilent, 2
bind = Super+Shift, 3, movetoworkspacesilent, 3
bind = Super+Shift, 4, movetoworkspacesilent, 4
bind = Super+Shift, 5, movetoworkspacesilent, 5
bind = Super+Shift, 6, movetoworkspacesilent, 6
bind = Super+Shift, 7, movetoworkspacesilent, 7
bind = Super+Shift, 8, movetoworkspacesilent, 8
bind = Super+Shift, 9, movetoworkspacesilent, 9
bind = Super+Shift, 0, movetoworkspacesilent, 10

################ 
# APPLICATIONS #
################

bind = Super, RETURN, exec, prime-run kitty
bind = SUPER SHIFT, RETURN, exec, prime-run kitty --class tmux -e tmux
bind = Super, Q, killactive,
bind = Super, B, exec, chromium
bind = Super ALT, B, exec, prime-run firefox
bind = Super+Shift, S, exec, flameshot gui
bind = Super, V, exec, ~/.config/hypr/config/scripts/cliptui_toggle.sh
bind = SUPER ALT, SPACE, exec, ~/.config/hypr/config/scripts/switchlayout.sh
bind = SUPER, M, exec, ~/PrismLauncher-Linux-x86_64.AppImage

########
# MISC #
########

bindel = ,XF86AudioRaiseVolume, exec, wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+
bindel = ,XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindel = ,XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindel = ,XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindel = ,XF86MonBrightnessUp, exec, brightnessctl -e4 -n2 set 5%+
bindel = ,XF86MonBrightnessDown, exec, brightnessctl -e4 -n2 set 5%-
bindl = ,XF86AudioNext, exec, playerctl next
bindl = ,XF86AudioPause, exec, playerctl play-pause
bindl = ,XF86AudioPlay, exec, playerctl play-pause
bindl = ,XF86AudioPrev, exec, playerctl previous

binde = SUPER, BracketRight, exec, wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 10%+
binde = SUPER, BracketLeft, exec, wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 10%-
bind = SUPER, Backslash, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
