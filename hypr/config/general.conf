source=~/.config/hypr/config/variables.conf
general {
    gaps_in = 0
    gaps_out = 0

    border_size = $border_size

    col.active_border = rgba(eeebdaff) rgba(eeebdaff) 45deg
    col.inactive_border = rgba(000000ff)

    resize_on_border = false

    allow_tearing = true

    no_focus_fallback = true
}

decoration {
    rounding = 0 
    rounding_power = 0

    active_opacity = 1.0
    inactive_opacity = 1.0

    shadow {
        enabled = false
    }

    blur {
		enabled = false
    }
}


dwindle {
  preserve_split = true
  smart_split = false
  smart_resizing = true
  force_split = 2
}

master {
    new_status = master
	mfact = 0.5
}


misc {
  vrr = 1
  disable_hyprland_logo = true
  disable_splash_rendering = true
  force_default_wallpaper = 0
}

binds {
  scroll_event_delay = 0
  hide_special_on_workspace_change = true
}

xwayland {
  force_zero_scaling = true
}

device {
    name = epic-mouse-v1
    sensitivity = -0.5
}
