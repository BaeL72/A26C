windowrule = match:class ^()$, match:title ^()$, no_blur on
windowrule = match:class .*, no_blur on
windowrule = match:class (cliptui), float on
windowrule = match:class (cliptui), size 1200 800
windowrule {
	name = no-fullscreen-border
	match:fullscreen = 1
	border_size = 0
}
windowrule {
    name = suppress-maximize-events
    match:class = .*

    suppress_event = maximize
}

windowrule {
    name = fix-xwayland-drags
    match:class = ^$
    match:title = ^$
    match:xwayland = true
    match:float = true
    match:fullscreen = false
    match:pin = false

    no_focus = true
}

windowrule {
    name = move-hyprland-run

    match:class = hyprland-run

    move = 20 monitor_h-120
    float = yes
}
