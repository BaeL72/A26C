# bind -r o select-pane -t :.+

# -----------------------------------------------------------------------------
# Pane resizing — repeatable vim directions
# -----------------------------------------------------------------------------
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Fine-grained (1 cell)
bind -r M-h resize-pane -L 1
bind -r M-j resize-pane -D 1
bind -r M-k resize-pane -U 1
bind -r M-l resize-pane -R 1

# -----------------------------------------------------------------------------
# Pane layout shortcuts
# -----------------------------------------------------------------------------
bind M-1 select-layout even-horizontal
bind M-2 select-layout even-vertical
bind M-3 select-layout main-horizontal
bind M-4 select-layout main-vertical
bind M-5 select-layout tiled
bind Space next-layout                             # cycle layouts

# Zoom / fullscreen toggle
bind z resize-pane -Z

# Mark / swap panes
bind m select-pane -m                              # mark pane
bind s swap-pane                                   # swap with marked

# -----------------------------------------------------------------------------
# Window management
# -----------------------------------------------------------------------------
bind c new-window -c "#{pane_current_path}"        # new window at cwd
bind , command-prompt "rename-window '%%'"
bind . command-prompt "move-window -t '%%'"

# Vim-style window navigation
bind -r n next-window
bind -r N previous-window
bind Tab last-window                               # toggle last window

# Move windows left/right
bind -r < swap-window -d -t -1
bind -r > swap-window -d -t +1

# Jump to window by number (1-9)
bind 1 select-window -t :1
bind 2 select-window -t :2
bind 3 select-window -t :3
bind 4 select-window -t :4
bind 5 select-window -t :5
bind 6 select-window -t :6
bind 7 select-window -t :7
bind 8 select-window -t :8
bind 9 select-window -t :9

# -----------------------------------------------------------------------------
# Session management
# -----------------------------------------------------------------------------
bind S command-prompt "new-session -s '%%'"
bind $ command-prompt "rename-session '%%'"
bind ( switch-client -p                            # previous session
bind ) switch-client -n                            # next session
bind L switch-client -l                            # last session
bind C-s choose-session                            # session picker

# -----------------------------------------------------------------------------
# Mouse (optional — comment out if you prefer pure keyboard)
# -----------------------------------------------------------------------------
# set -g mouse on

# -----------------------------------------------------------------------------
# Miscellaneous quality-of-life
# -----------------------------------------------------------------------------
setw -g automatic-rename on                        # rename window to running cmd
setw -g aggressive-resize on
set  -g wrap-search off                            # no wrap on / search (vim-like)

# Clear screen (C-l taken for pane nav — use prefix C-l)
bind C-l send-keys 'C-l'

# Kill without confirmation
bind x kill-pane
bind X kill-window
bind q confirm-before -p "kill-session #S? (y/n)" kill-session

# Open a scratch floating window (tmux ≥ 3.2)
bind g display-popup -E -w 80% -h 80% -d "#{pane_current_path}" "$SHELL"

# -----------------------------------------------------------------------------
# Status bar — minimal & informative
# -----------------------------------------------------------------------------
set -g status on
set -g status-position top

set -g status-justify left
# Colours (uses terminal 256-colour palette — adjust to taste)
set -g status-style                 "fg=#77dd77,bg=#101516"
set -g window-status-style          "fg=#707070,bg=#1c1c1c"
set -g window-status-current-style  "fg=#e7e7e7,bg=#0d0d0d"
set -g window-status-activity-style "fg=colour208,bg=#000000"
set -g pane-border-style            "fg=#2c682d"
set -g pane-active-border-style     "fg=#2c682d"
set -g message-style                "fg=colour255,bg=colour238"
set -g mode-style                   "fg=#c7d5e4,bg=#4e518b"  # copy-mode highlight

# Left: session name
set -g status-left-length 30
set -g status-left " [#S] "

# Right: host · date · time
set -g status-right-length 60
set -g status-right " "

# Window list format
setw -g window-status-format         " #I:#W#{?window_flags,#{window_flags}, } "
setw -g window-status-current-format " #I:#W#{?window_flags,#{window_flags}, } "

is_vim="ps -o state= -o comm= -t '#{pane_tty}' | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|n?vim?x?)(diff)?$'"

unbind -n C-h
unbind -n C-j
unbind -n C-k
unbind -n C-l

bind -n C-w switch-client -T cw
bind -T cw h if-shell "$is_vim" 'send-keys C-w h' 'select-pane -L'
bind -T cw j if-shell "$is_vim" 'send-keys C-w j' 'select-pane -D'
bind -T cw k if-shell "$is_vim" 'send-keys C-w k' 'select-pane -U'
bind -T cw l if-shell "$is_vim" 'send-keys C-w l' 'select-pane -R'
