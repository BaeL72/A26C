# =============================================================================
# tmux.conf — Vim-like keymaps
# Place at: ~/.tmux.conf
# Reload:   <prefix> r  or  tmux source ~/.tmux.conf
# =============================================================================

# -----------------------------------------------------------------------------
# Core settings
# -----------------------------------------------------------------------------
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",xterm-256color:Tc"   # true colour
set -g history-limit 50000
set -g display-time 4000
set -g status-interval 5
set -g focus-events on
set -sg escape-time 0                              # no ESC delay (vital for vim)
set -g base-index 1                                # windows start at 1
setw -g pane-base-index 1                          # panes start at 1
set -g renumber-windows on                         # keep window numbers gapless

# -----------------------------------------------------------------------------
# Reload config
# -----------------------------------------------------------------------------
bind r source-file ~/.tmux.conf \; display "tmux.conf reloaded"

# -----------------------------------------------------------------------------
# Vi mode — copy & navigation
# -----------------------------------------------------------------------------
setw -g mode-keys vi
set  -g status-keys vi

# Enter copy mode with prefix+[ (default) or with vim-style keys
bind Escape copy-mode                              # prefix Escape → copy mode
bind -T copy-mode-vi v   send -X begin-selection
bind -T copy-mode-vi V   send -X select-line
bind -T copy-mode-vi C-v send -X rectangle-toggle
bind -T copy-mode-vi y   send -X copy-selection-and-cancel
bind -T copy-mode-vi Y   send -X copy-end-of-line
bind -T copy-mode-vi H   send -X start-of-line
bind -T copy-mode-vi L   send -X end-of-line
bind -T copy-mode-vi d   send -X halfpage-down
bind -T copy-mode-vi u   send -X halfpage-up
bind -T copy-mode-vi D   send -X page-down
bind -T copy-mode-vi U   send -X page-up

# Search in copy mode (already / and ? by default, but make explicit)
bind -T copy-mode-vi / command-prompt -p "search down:" "send -X search-forward '%%%'"
bind -T copy-mode-vi ? command-prompt -p "search up:"   "send -X search-backward '%%%'"
bind -T copy-mode-vi n send -X search-again
bind -T copy-mode-vi N send -X search-reverse

# Paste
bind p paste-buffer
bind P choose-buffer                               # pick from buffer list

# -----------------------------------------------------------------------------
# Pane splitting — intuitive mnemonics
# -----------------------------------------------------------------------------
bind | split-window -h -c "#{pane_current_path}"  # vertical   split
bind - split-window -v -c "#{pane_current_path}"  # horizontal split
bind \\ split-window -h -c "#{pane_current_path}" # alias
unbind '"'
unbind %

# -----------------------------------------------------------------------------
# Pane navigation — vim hjkl
# -----------------------------------------------------------------------------
